name: shots
on:
  workflow_dispatch:
jobs:
  parity:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mac
        with:
          klipy-key: ${{ secrets.KLIPY_KEY }}
      - run: scripts/parity
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity
          path: shots/raw/parity/*.png
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/uitest/*.log
            build/uitest/*.ips
