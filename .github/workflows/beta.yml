# beta is the commit of main that goes to TestFlight: Xcode Cloud builds every push to it (ci_scripts/).
# Each move of beta tags the commit it left as beta-prev, so the build's What to Test lists the commits since.
# When nobody has moved beta for 24 hours and main has changed, main becomes the new beta.
name: beta
on:
  push:
    branches: [beta]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beta
jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the commit beta left
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git tag -f beta-prev "${{ github.event.before }}"
          git push -f origin beta-prev
      - name: Cut a beta from main after 24 quiet hours
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/activity?ref=refs/heads/beta&per_page=1" --jq '.[0].timestamp // empty')
          if [ -n "$last" ] && [ $(($(date +%s) - $(date -d "$last" +%s))) -lt 86400 ]; then
            echo "beta last moved $last"; exit 0
          fi
          if git merge-base --is-ancestor origin/main origin/beta; then
            echo "beta already has main"; exit 0
          fi
          git tag -f beta-prev origin/beta
          git push -f origin beta-prev
          git push -f origin origin/main:refs/heads/beta
