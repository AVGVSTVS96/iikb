# beta is the commit of main that goes to TestFlight: Xcode Cloud builds every push to it (ci_scripts/).
# Each move of beta tags the commit it left as beta-prev; TestFlight/WhatToTest.en-US.txt is the testers' note.
# hex cuts a beta from main, with its note, when beta has sat 24 hours behind main.
name: beta
on:
  push:
    branches: [beta]
permissions:
  contents: write
concurrency:
  group: beta
jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the commit beta left
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git tag -f beta-prev "${{ github.event.before }}"
          git push -f origin beta-prev
